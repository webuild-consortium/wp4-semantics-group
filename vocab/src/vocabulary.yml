  - id: ScopeOfPower
    label: scope of power
    comment: the scope of power delegated to a mandatee in the context of representing a company
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/scopeofpower

  - id: Shareholder
    label: shareholder
    comment: the common attributes of a shareholder of the focus legal entity — the referenced entity, the stake and the aggregated share in the focus entity; see its natural-person and legal-person subclasses for the specific attributes
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/shareholder

  - id: Shareholding
    label: shareholding
    comment: a capital and voting stake (Anteil) held in a company, expressed as relative share, absolute amounts and relative voting rights, and whether the participation is direct
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/shareholding

  - id: ShareInFocus
    label: share in focus entity
    comment: the capital and voting share a holder has in the focus legal entity, computed under the several beneficial-ownership calculation methods used in German anti-money-laundering practice (GwG / Transparenzregister). Each method yields a relative capital share together with the relative voting rights; the methods differ in how indirect holdings along an ownership path (Strang) are counted and at which threshold (Grenze) a holding is recognised - see the standard, accG10, accG25, dom10 and dom25 properties
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/shareinfocus

  - id: ShareVotingPair
    label: share and voting pair
    comment: a pair of relative capital share and relative voting rights computed for a given beneficial-ownership calculation method
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/sharevotingpair

  - id: Site
    label: Site
    comment: a place, premises or location at which an organisation is present or located
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/site

  - id: SocialSecurityContribution
    label: Social Security Contribution
    upper_value: cred:CredentialSubject
    comment: A social security contribution attestation is an attestation issued by a competent authority or authorized body confirming information about an employer’s fulfilment of obligations related to social security contributions arising from the employment of workers.
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/socialsecuritycontribution

  - id: StatutoryPartner
    label: Statutory Partner
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/statutorypartner

  - id: StockExchange
    label: stock exchange
    comment: a stock exchange on which a security may be listed, identified by name, country and operating market identification code (MIC)
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/stockexchange

  - id: StockExchangeListing
    label: stock exchange listing
    comment: a listing of the legal entity on a stock exchange, with its market identification code and ticker symbol
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/stockexchangelisting

  - id: TransparencyRegisterEntry
    label: transparency register entry
    comment: a beneficial owner as recorded in the transparency register (Transparenzregister), with the natural person and the type and scope of their economic interest
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/transparencyregisterentry

  # --- KYC (delivery-json) control & classification classes ---

  - id: TransparencyRegisterExtract
    label: transparency register extract
    comment: metadata of a transparency register (Transparenzregister) extract obtained for the focus legal entity, including application and reference numbers, validity date and discrepancy-report information
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/transparencyregisterextract

  - id: TypeOfEmployment
    label: Type Of Employment
    comment: the category or form of an employment relationship, indicating how a worker is employed or engaged by an employer
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/typeofemployment

  - id: TypeOfRepresentation
    label: type of representation
    comment: type of representation meaning Alone or Jointly
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/typeofrepresentation

  - id: UBO
    label: Ultimate Beneficiary Owner
    comment: An Ultimate Beneficial Owner (UBO) is the natural person (real human) who ultimately owns, controls, or profits from a legal person (company).
    defined_by: https:/w3id.org/ebwv/terminology#/concept/UBO

  - id: VATRegistrationUnit
    label: VAT Registration Unit
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/vatregistrationunit

  - id: Vessel
    label: Vessel
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/vessel

  - id: WorkAssignment
    label: Work Assignment
    upper_value: schema:Thing
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/workassignment

