  - id: FinancialYear
    label: financial year
    comment: an annual financial statement (Geschäftsjahr) of the focus legal entity, reporting size class, revenue, operating result, balance sheet total, headcount and the statement date
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/financialyear

  - id: GeneralPartner
    label: General Partner
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/generalpartner

  - id: GeneralPartnerHolding
    label: general partner holding
    comment: the common attributes of a general partner (Komplementär) of the focus legal entity — the referenced entity, the stake and the voting rights; see its natural-person and legal-person subclasses for the specific attributes
