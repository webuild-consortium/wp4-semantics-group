  - id: PublicSectorBody
    label: public sector body
    comment: public sector body’ means a Union entity, a national, state, regional or local authority, a body governed by public law or an association formed by one or several such entities or bodies , or a private entity mandated by at least one such entities, authorities, bodies or associations to provide public services, when acting under such a mandate
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/publicsectorbody

  - id: RegisterIdentification
    label: register identification
