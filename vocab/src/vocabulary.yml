    domain: EconomicOperator
    range: xsd:boolean
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/temporaryworkagency

  - id: terms
    label: terms
    domain: PaymentTerms
    range: Incoterms
    one_of:  [EXW, FCA, CPT, CIP, DAP, DPU, DDP, FAS, FOB ]
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/terms

  - id: cred:termsOfUse
    label: terms of use
    domain: VerifiableCredential
    range: GovernanceRulebook
    defined_by: https://www.w3.org/TR/vc-data-model-2.0/#terms-of-use

  - id: thoroughfare
    label: thoroughfare
    domain: Address
    range: xsd:string
    comment: the name of a passage or way through from one location to another
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/thoroughfare

  - id: tickerSymbol
    label: ticker symbol
    domain: StockExchangeListing
    range: xsd:string
    comment: the stock exchange ticker symbol of the legal entity
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/tickersymbol

  - id: totalPayroll
    label: total payroll
    comment: The total payroll amount associated with the employer for the reference period used in a social security contribution attestation.
    domain: SocialSecurityContribution
    range: MonetaryAmount
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/totalpayroll

  - id: transitionalRules
    label: transitional rules
    domain: A1Certificate
    range: xsd:boolean
    comment: a temporary legal or administrative rule set that applies to a case because the relevant situation falls within a transition from one regime, framework, or procedure to another
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/transitionalrules

  - id: transparencyRegister
    label: transparency register
    domain: BeneficialOwnership
    range: TransparencyRegisterEntry
    comment: beneficial owners as recorded in the transparency register
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/transparencyregister

  - id: transparencyRegisterExtract
    label: transparency register extract
    domain: KycLegalEntity
    range: TransparencyRegisterExtract
    comment: a transparency register extract obtained for the focus legal entity
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/transparencyregisterextract

  - id: type
    label: type
    domain: VATRegistrationUnit
    range: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/type

  - id: typeOfEmployment
    label: type of employment
    domain:
      - A1Certificate
      - PostedWorkerNotification
    range: TypeOfEmployment
    one_of: [Permanent, Temporary]
    comment: the category or form of an employment relationship, indicating how a worker is employed or engaged by an employer
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/typeofemployment

  - id: typeOfRepresentation
    label: type of representation
    domain:
      - LegalRepresentative
      - StatutoryPartner
    range: TypeOfRepresentation
    comment: specifies how a representative may act on behalf of the principal, meaning whether they can act alone or only together with others.
    one_of: [Alone, Jointly]
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/typeofrepresentation

  - id: ultimateParent
    label: ultimate parent
    domain: KycLegalEntity
    range:
      - LimitedLiabilityCompany
      - Partnership
    range_union: true
    comment: the ultimate (top) parent company of the focus legal entity
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/ultimateparent

  - id: url
    label: url
    domain: GovernanceRulebook
    range: xsd:anyURI
    comment: Reference (URL) to the online dataspace governance rulebook for the given DSI or DS.
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/url

  - id: validFromDate
    label: valid from date
    domain: TransparencyRegisterExtract
    range: xsd:date
    comment: the date from which the transparency register extract is valid
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/validfromdate

  - id: verificationDate
    label: verification date
    domain: KycEvidence
    range: xsd:date
    comment: the date on which the verification was performed
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/verificationdate

  - id: version
    label: verson
    domain: GovernanceRulebook
    range: xsd:string
    comment: Version of the online rulebook at the time of acceptance.
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/version

  # --- KYC (delivery-json) core properties ---

  - id: votingRightsBeneficialOwner
    label: voting rights beneficial owner
    domain: BeneficialOwnershipVariant
    range: BeneficialOwner
    comment: a beneficial owner determined on the basis of voting rights - a natural person who, directly or indirectly, controls a share of the voting rights (Stimmrechte) of the focus legal entity that reaches the threshold of the enclosing calculation method (more than 25 percent under the standard method, or the 10 or 25 percent threshold of the accumulation and domination methods) (section 3(2) sentence 1 no. 2 GwG)
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/votingrightsbeneficialowner

  - id: website
    label: website
    domain: ContactPoint
    range: xsd:anyURI
    comment: website of the legal entity
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/website

datatype:
  - id: AccountType
    label: account type
    upper_value: xsd:string
    comment: list of account types TBD

  - id: BanzNumber
    label: Bundesanzeiger number
    upper_value: xsd:string
    comment: internal check number (BANZ-ID) assigned by Bundesanzeiger Verlag that identifies a company as part of the KYC service
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/banznumber

  - id: Bic
    label: Business Identifier Code aka Swift Code
    upper_value: xsd:string
    pattern: '[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})'
    comment: International code (i.e. BIC or SWIFT code), as defined in ISO 9362, of the financial institution
    defined_by: https://www.iso.org/standard/84108.html

  - id: ClearingNumber
    label: ClearingNumber
    upper_value: xsd:string
    comment: Clearing number, only used in some countries, of the identification of the financial institution.

  - id: CountryCode
    label: Country Code
    upper_value: xsd:string
    pattern: '[A-Z]{2}(-.*)?'
    comment: 2 letter country code according to ISO-3166
    defined_by: https://www.iso.org/iso-3166-country-codes.html

  - id: Currency
    label: Currency
    upper_value: xsd:string
    pattern: '[A-Z]{3}'
    comment: 3 letter currency code according to the European controlled vocabulary 'Currency'
    defined_by:
      - https://op.europa.eu/en/web/eu-vocabularies/concept-scheme/-/resource?uri=http://publications.europa.eu/resource/authority/currency
      - http://publications.europa.eu/resource/authority/currency

  - id: DunsNumber
    label: DUNS number
    upper_value: xsd:string
    pattern: '[0-9]{9}'
    comment: The Data Universal Numbering System, abbreviated as DUNS or D-U-N-S, is a proprietary system developed and managed by Dun & Bradstreet (D&B) that assigns a unique numeric identifier, referred to as a "DUNS number" to a single business entity.
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/dunsnumber

  - id: Eori
    label: economic operator registration and identification
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/eori

  - id: Euid
    label: EUID
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/euid

  - id: Excise
    label: excise number
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/excise

  - id: GlobalLocationNumber
    label: Global Location Number
    pattern: '[0-9]{13}'
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/globallocationnumber

  - id: GS1CompanyPrefix
    label: GS1 company prefix
    pattern: '[0-9]{7,9}'
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/gs1companyprefix

  - id: Iban
    label: IBAN
    upper_value: xsd:string
    pattern: '[A-Z]{2}[0-9A-Z]{13,30}'
    comment: IBAN as defined by ISO 13616:2020
    defined_by:
      - https://www.iso.org/standard/81090.html

  - id: Isin
    label: International Securities Identification Number
    upper_value: xsd:string
    pattern: '[A-Z]{2}[A-Z0-9]{9}[0-9]'
    comment: International Securities Identification Number uniquely identifying a security, as defined in ISO 6166
    defined_by: https://www.iso.org/standard/78502.html

  - id: KmgMid
    label: KMG-MID
    pattern: '[0-9]{9}'
    upper_value: xsd:string
    comment: A nationally unique identifier assigned to an agricultural holding registered in the Slovenian Register of Agricultural Holdings (Register kmetijskih gospodarstev, RKG). The identifier uniquely identifies a farm or agricultural holding for administrative, regulatory, subsidy, traceability, and agricultural data exchange purposes.
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/kmgmid

  - id: Lei
    label: legal entity identifier
    upper_value: xsd:string
    comment: a globally unique reference code assigned under the Global LEI System to identify a legal entity participating in financial, business or regulatory transactions
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/lei

  - id: Nace21
    label: Nace Rev. 2.1
    upper_value: xsd:string
    comment: notation of the main activity of the company according to the European controlled vocabulary 'Nace Rev. 2.1'
    defined_by:
      - https://op.europa.eu/en/web/eu-vocabularies/concept-scheme/-/resource?uri=http://data.europa.eu/ux2/nace2.1/nace2.1
      - http://data.europa.eu/ux2/nace2.1/nace2.1

  - id: Naics
    label: NAICS 2002
    upper_value: xsd:string
    comment: notation of the main activity of the company according to the North American Industry Classification System (NAICS), edition 2002
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/naics

  - id: NationalBankCode
    label: National Bank Code
    upper_value: xsd:string
    comment: Country-specific code for e.g. internal routing within a specific country’s clearing system (e.g. BLZ, Sort Code)

  - id: PeppolId
    label: Peppol ID
    upper_value: xsd:string
    pattern: '[0-9]{4}(:.*)'
    comment: A Peppol ID is a unique identifier used to securely exchange electronic documents (like invoices) within the Peppol network, acting similarly to a digital address. It consists of a four-digit scheme ID (identifying the type of number) and a specific participant ID, separated by a colon (e.g., 9930:DE123456789)
    defined_by:
    - https://docs.peppol.eu/edelivery/
    - https://docs.peppol.eu/poacc/billing/3.0/codelist/ICD/

  - id: PublicSectorBodyId
    label: unique identifier of public body
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/publicsectorBodyId

  - id: Sic
    label: SIC 1987
    upper_value: xsd:string
    comment: notation of the main activity of the company according to the Standard Industrial Classification (SIC), edition 1987
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/sic

  - id: Tin
    label: tax reference number
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/tin

  - id: VatId
    label: unique vat identifier
    upper_value: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/vatid

  - id: Wz2003
    label: WZ 2003
    upper_value: xsd:string
    comment: notation of the main activity of the company according to the German Classification of Economic Activities (Klassifikation der Wirtschaftszweige), edition 2003
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/wz2003

  - id: Wz2008
    label: WZ 2008
    upper_value: xsd:string
    comment: notation of the main activity of the company according to the German Classification of Economic Activities (Klassifikation der Wirtschaftszweige), edition 2008
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/wz2008

