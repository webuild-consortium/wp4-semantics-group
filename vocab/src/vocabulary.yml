  - id: absoluteShare
    label: absolute share
    domain: Shareholding
    range: MonetaryAmount
    comment: total value of the shares held directly and indirectly; may be repeated to express the same value in several currencies
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/absoluteshare

  - id: academicTitle
    label: academic title
    domain: NaturalPerson
    range: xsd:string
    comment: title (Titel) of the natural person as recorded in the official registers
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/academictitle

  # --- KYC (delivery-json) ownership & financial properties ---

  - id: acceptedAt
    label: accepted at
    domain: GovernanceRulebook
    range: xsd:dateTime
    comment: Datetime when the rulebook was accepted. May differ from issuance time in an outbound flow where a credential is issued to an existing member based on a previously completed onboarding flow.
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/acceptedat

  - id: accG10
    label: accumulation 10% method
    domain:
      - ShareInFocus
      - BeneficialOwnership
    range:
      - ShareVotingPair
      - BeneficialOwnershipVariant
    range_union: true
    comment: determined under the accumulation (Addition) method with a 10 percent threshold (Grenze) - relative holdings of at least 10 percent are added up across all ownership paths (Straenge) that lead to the focus entity
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/accg10

  - id: accG25
    label: accumulation 25% method
    domain:
      - ShareInFocus
      - BeneficialOwnership
    range:
      - ShareVotingPair
      - BeneficialOwnershipVariant
    range_union: true
    comment: determined under the accumulation (Addition) method with a 25 percent threshold (Grenze) - relative holdings of at least 25 percent are added up across all ownership paths (Straenge) that lead to the focus entity
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/accg25

  - id: accountName
    label: account name
    domain: BankAccount
    range: xsd:string
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/accountname

