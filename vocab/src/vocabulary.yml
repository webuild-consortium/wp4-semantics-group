  - id: PowerOfAttorney
    label: Power of attorney
    upper_value: cred:CredentialSubject
    comment: A power of attorney is a verifiable authorisation that allows a principal (a natural person) or group of principals to delegate authority to a mandatee (a natural person). The power of attorney must be signed by the principal. If the power of attorney is given by a group of principals, each principal must sign it. A power of attorney is limited in scope. It enables the mandatee to represent or act on behalf of the principals within this scope.<br> The power of attorney must prove that the principals are legitimate holders of the power they are delegating. Proof of provenance must be provided in the credential to establish this trust.
