  - id: ContactPoint
    label: Contact Point
    comment: a designated communication channel or organisational function through which an entity can be contacted for a specific purpose
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/contactpoint

  - id: CorporateRole
    label: corporate role
    comment: a function held by a legal representative or statutory partner within a company, e.g. CEO or CFO
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/corporaterole

  - id: cred:CredentialEvidence
    label: Credential Evidence
    defined_by: https://www.w3.org/TR/vc-data-model-2.0/#evidence
    context: https://www.w3.org/ns/credentials/v2

  - id: cred:CredentialSubject
    label: Credential Subject
    defined_by: https://w3.org/TR/vc-data-model-2.0/#credential-subject
    context: https://www.w3.org/ns/credentials/v2

  - id: DataSpaceRole
    label: role of dataspace member
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/dataspacerole

  - id: DeliveryType
    label: delivery type
    comment: indicates whether a KYC delivery represents a researched product or a research that was aborted
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/deliverytype

