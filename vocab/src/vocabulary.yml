vocab:
  - id: ebwv
    value: https://w3id.org/ebwv#
    context: https://w3id.org/ebwv/v0.1

prefix:
  - id: cred
    value: https://www.w3.org/2018/credentials#

  - id: jsonld
    value: http://www.w3.org/ns/json-ld#

  - id: schema
    value: https://schema.org/

  - id: skos
    value: http://www.w3.org/2004/02/skos/core#

  - id: time
    value: http://www.w3.org/2006/time#

ontology:
  - property: dc:title
    value: European Business Wallet Vocabulary v0.1

  - property: dc:description
    value: Vocabulary used by the Verifiable Credentials of the European Business Wallet Framework

  - property: rdfs:seeAlso
    value: https://webuild-consortium.github.io/wp4-semantics-group/ebwv

class:
  - id: A1Certificate
    label: A1 Certificate
    upper_value: cred:CredentialSubject
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/a1certificate

  - id: Address
    label: Address
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/address

  - id: Agent
    label: Agent
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/agent

  - id: AttestationLegalCategory
    label: Attestation Legal Category
    comment: a categorization of electronic attestations of attributes into three primary types, each associated with a distinct level of assurance and legal effect
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/attestationlegalcategory

  - id: BankAccount
    label: Bank Account
    upper_value: cred:CredentialSubject
    comment: an account held with a credit institution or payment service provider that enables a legal or natural person to receive, hold, and transfer funds
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/bankaccount
    example:
      - label: Credential with credential subject of type BankAccount
        json: |
          {
            "@context": [
              "https://www.w3.org/ns/credentials/v2",
              "https://w3id.org/ebwv/v0.1"
            ],
            "@id": "urn:uuid:f0adc5fe-3558-40f8-b1e2-97713ec44dff",
            "@type": [
              "VerifiableCredential",
              "ElectronicAttestationOfAttributes"
            ],
            "attestationLegalCategory": "QEAA",
            "credentialSubject": {
              "@id": "urn:uuid:eb887cd3-5080-44e6-8b3d-e008d80e19fc",
              "@type": "BankAccount",
              "accountName": "ACME: Business expenses HR",
              "accountType": "Corporate Account",
              "iban": "DE02500105170137075030",
              "owner" : "did:key:$publicKeyOfOwner$",
              "provider" : "did:key:$publicKeyOfProvider$"
            },
            "validUntil": "2029-12-03T12:19:52Z",
            "validFrom": "2019-12-03T12:19:52Z",
            "issuer": "did:key:$publicKeyOfProvider$"
          }

  - id: BeneficialOwner
    label: beneficial owner
    comment: a beneficial owner of the focus legal entity, with their direct and total capital and voting shares, high-risk indicator and, where applicable, the reason for other control
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/beneficialowner

  - id: BeneficialOwnership
    label: beneficial ownership
    comment: the beneficial-ownership (wirtschaftlich Berechtigte) analysis of the focus legal entity across the standard, accumulation, domination and customer-due-diligence calculation methods
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/beneficialownership

  - id: BeneficialOwnershipVariant
    label: beneficial ownership variant
    comment: the beneficial owners determined under one calculation method, grouped by the basis of determination — capital, voting rights, other control, or fictitious
    defined_by: https://sanastot.suomi.fi/en/terminology/webuild/concept/beneficialownershipvariant

  - id: Company
    label: Company as defined in directive-EU-2025/25
    upper_value:
      - cred:CredentialSubject
      - EconomicOperator
      - KycLegalEntity
      - LegalPerson
