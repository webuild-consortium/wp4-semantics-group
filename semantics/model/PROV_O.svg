<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="1888px" preserveAspectRatio="none" style="width:3675px;height:1888px;background:#FFFFFF;" version="1.1" viewBox="0 0 3675 1888" width="3675px" zoomAndPan="magnify"><title>PROV-O Class Model &#8212; WEBUILD Imported Core</title><defs><filter height="1" id="b1pl9mbycb93mq0" width="1" x="0" y="0"><feFlood flood-color="#FFFFE0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b1pl9mbycb93mq1" width="1" x="0" y="0"><feFlood flood-color="#CEEED0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="10"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="347.4844" x="1656.8828" y="23.5352">PROV-O Class Model &#8212; WEBUILD Imported Core</text></g><g class="legend" data-source-line="21"><rect fill="#DDDDDD" height="125.418" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="825.0898" x="12" y="49.4883"/><text fill="#8B0000" filter="url(#b1pl9mbycb93mq0)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.249" x="21.4297" y="68.0234">PROV-O class</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="17.7188" x="119.1084" y="68.0234">&#160;&#160;&#160;&#160;</text><text fill="#285F17" filter="url(#b1pl9mbycb93mq1)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.5557" x="141.2568" y="68.0234">Display expression / external OWL class</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="815.0898" x="17" y="84.5117">All member names use the prov: namespace. + property: available; no minimum cardinality is asserted by this notation.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="602.5947" x="17" y="101">Solid arrow: object property (source member to range). Hollow triangle: rdfs:subClassOf.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="594.9316" x="17" y="117.4883">Green union boxes abbreviate OWL expressions; they are not additional named classes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8457" x="17" y="133.9766">Repeated boxes with the same class name are references to that same class.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="511.499" x="17" y="150.4648">Inherited members apply to subclasses. No UML multiplicities are invented.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="715.0801" x="17" y="166.9531">WEBUILD reuses prov:Agent directly. Extension Role and RoleFulfillment are not mapped to PROV classes.</text></g><!--class Activity--><g class="entity" data-qualified-name="Activity" data-source-line="31" id="ent0002"><rect fill="#FFFFE0" height="273.3242" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="225.0762" x="1647.35" y="1273.6963"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.7725" x="1717.5019" y="1292.2314">prov:Activity</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="1648.35" x2="1871.4262" y1="1300.1845" y2="1300.1845"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.3066" x="1653.35" y="1317.7197">+endedAtTime : xsd:dateTime</text><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.3135" x="1653.35" y="1334.208">+generated :</text><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.1855" x="16