 L3214.2408,1389.8863" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.9473" x="2883.46" y="1407.4546">OWL restriction: prov:hadActivity max 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.7808" x="2883.46" y="1422.7652">Use prov:activity to identify the influencing Activity.</text></g><g class="entity" data-qualified-name="GMN114" data-source-line="265" id="ent0115"><path d="M2429.74,638.0763 L2429.74,709.3184 A0,0 0 0 0 2429.74,709.3184 L2829.9617,709.3184 A0,0 0 0 0 2829.9617,709.3184 L2829.9617,648.0763 L2819.9617,638.0763 L2584.52,638.0763 L2442.98,539.8663 L2576.52,638.0763 L2429.74,638.0763 A0,0 0 0 0 2429.74,638.0763" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2819.9617,638.0763 L2819.9617,648.0763 L2829.9617,648.0763 L2819.9617,638.0763" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.5908" x="2435.74" y="655.6446">Additional domain axioms (intersection with Influence):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.2217" x="2435.74" y="670.9552">prov:hadActivity: Delegation OR Derivation OR End OR Start.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.856" x="2435.74" y="686.2657">prov:hadRole: Association OR InstantaneousEvent.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.7036" x="2435.74" y="701.5763">These are domain inferences, not mandatory properties.</text></g><g class="entity" data-qualified-name="GMN117" data-source-line="272" id="ent0118"><path d="M129.35,1814.6363 L129.35,1855.2573 A0,0 0 0 0 129.35,1855.2573 L588.3446,1855.2573 A0,0 0 0 0 588.3446,1855.2573 L588.3446,1824.6363 L578.3446,1814.6363 L362.85,1814.6363 L358.85,1703.8463 L354.85,1814.6363 L129.35,1814.6363 A0,0 0 0 0 129.35,1814.6363" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M578.3446,1814.6363 L578.3446,1824.6363 L588.3446,1824.6363 L578.3446,1814.6363" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.9946" x="135.35" y="1832.2046">Also declared owl:NamedIndividual in the imported source (punning).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.0522" x="135.35" y="1847.5152">No hadMember max 0 restriction is asserted in this OWL file.</text></g><g class="entity" data-qualified-name="Axioms" data-source-line="277" id="ent0120"><path d="M3237.66,193.9063 L3237.66,341.7012 L3656.0423,341.7012 L3656.0423,203.9063 L3646.0423,193.9063 L3237.66,193.9063" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3646.0423,193.9063 L3646.0423,203.9063 L3656.0423,203.9063 L3646.0423,193.9063" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="192.7974" x="3243.66" y="211.4746">Other class / inverse axioms</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.958" x="3243.66" y="226.7852">Disjoint: Activity / Entity; Agent / InstantaneousEvent;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.3823" x="3243.66" y="242.0957">Entity / InstantaneousEvent; ActivityInfluence / EntityInfluence.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8062" x="3243.66" y="257.4063">Inverse pairs: generated / wasGeneratedBy;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.0322" x="3243.66" y="272.7168">invalidated / wasInvalidatedBy; influenced / wasInfluencedBy.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.8057" x="3243.66" y="288.0273">The domain/range of influenced follow from its inverse.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.6416" x="3243.66" y="303.3379">prov:value has no explicit range in the source (Literal shown).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.8921" x="3243.66" y="318.6484">wasRevisionOf and specializationOf are object properties;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.0298" x="3243.66" y="333.959">only their duplicate annotation declarations were removed.</text></g><!--reverse link Influence to ActivityInfluence--><g class="link" data-entity-1="ent0018" data-entity-2="ent0003" data-link-type="association" data-source-line="180" id="lnk35"><path codeLine="180" d="M2361.85,550.6963 C2361.85,550.6963 2383.32,649.4663 2406.85,726.6963 C2430.3,803.6863 2462.37,891.1863 2482.85,945.3063" fill="none" id="Influence-backto-ActivityInfluence" style="stroke:#8B0000;stroke-width:1;"/></g><!--reverse link Influence to AgentInfluence--><g class="link" data-entity-1="ent0018" data-entity-2="ent0005" data-link-type="association" data-source-line="181" id="lnk36"><path codeLine="181" d="M2361.85,550.6963 C2361.85,550.6963 2759.87,561.5062 2852.85,620.6963 C2926.81,667.7862 3238.39,1189.5363 3337.46,1357.4663" fill="none" id="Influence-backto-AgentInfluence" style="stroke:#8B0000;stroke-width:1;"/></g><!--reverse link AgentInfluence to Association--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="association" data-source-line="182" id="lnk37"><path codeLine="182" d="M3367.85,1464.1963 C3367.85,1464.1963 3307.47,1524.3363 3246.85,1550.69