<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="485px" preserveAspectRatio="none" style="width:689px;height:485px;background:#FFFFFF;" version="1.1" viewBox="0 0 689 485" width="689px" zoomAndPan="magnify"><title>Agents &#8212; Direct PROV-O Reuse and Physical Machines</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="396.1699" x="139.5272" y="23.5352">Agents &#8212; Direct PROV-O Reuse and Physical Machines</text></g><g class="legend" data-source-line="30"><rect fill="#DDDDDD" height="75.9531" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="503.0352" x="12" y="49.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="488.8516" x="17" y="68.0234">prov: classes and their existing hierarchy come from the pinned import.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="493.0352" x="17" y="84.5117">Machine and runsSoftwareAgent are WEBUILD extension terms (ebwsm:).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="452.915" x="17" y="101">No separate WEBUILD Agent class or Dublin Core Agent alignment.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="369.3047" x="17" y="117.4883">Sibling classes are not declared disjoint or exhaustive.</text></g><!--class Agent--><g class="entity" data-qualified-name="Agent" data-source-line="9" id="ent0002"><rect fill="#FFFFE0" height="42.4883" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="80.9287" x="336.29" y="145.4414"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.9287" x="339.29" y="163.9766">prov:Agent</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="337.29" x2="416.2187" y1="171.9297" y2="171.9297"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="337.29" x2="416.2187" y1="179.9297" y2="179.9297"/></g><polygon fill="none" points="376.2581,187.9297,382.7891,208.0877,368.793,207.7608" style="stroke:#8B0000;stroke-width:1;"/><line style="stroke:#8B0000;stroke-width:1;" x1="375.791" x2="375.75" y1="207.9242" y2="209.6814"/><!--class Person--><g class="entity" data-qualified-name="Person" data-source-line="10" id="ent0003"><rect fill="#FFFFE0" height="55.4434" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="97.4268" x="421.04" y="279.7114"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.5068" x="429.5" y="298.2466">prov:Person</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="91.4268" x="424.04" y="311.8345">Menselijke Agent</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="422.04" x2="517.4668" y1="319.1548" y2="319.1548"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="422.04" x2="517.4668" y1="327.1548" y2="327.1548"/></g><!--class Organization--><g class="entity" data-qualified-name="Organization" data-source-line="11" id="ent0004"><rect fill="#FFFFE0" height="55.4434" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="128.9443" x="553.28" y="279.7114"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.9443" x="556.28" y="298.2466">prov:Organization</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="68.5459" x="583.4792" y="311.8345">Organisation</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="554.28" x2="681.2243" y1="319.1548" y2="319.1548"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="554.28" x2="681.2243" y1="327.1548" y2="327.1548"/></g><!--class SoftwareAgent--><g class="entity" data-qualified-name="SoftwareAgent" data-source-line="12" id="ent0005"><rect fill="#FFFFE0" height="55.4434" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="139.499" x="7" y="279.7114"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.499" x="10" y="298.2466">prov:SoftwareAgent</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="124.0454" x="14.7268" y="311.8345">Running software actor</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="8" x2="145.499" y1="319.1548" y2="319.1548"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="8" x2="145.499" y1="327.1548" y2="327.1548"/></g><!--class Machine--><g class="entity" data-qualified-name="Machine" data-source-line="13" id="ent0006"><rect fill="#FFFFE0" height="71.9316" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="188.4399" x="189.75" y="271.9314"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.2197" x="229.8601" y="290.4666">ebwsm:Machine</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="182.4399" x="192.75" y="304.0545">Physical software-controlled actor</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="190.75" x2="377.1899" y1="311.3748" y2="311.3748"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.9141" x="195.75" y="328.9099">+runsSoftwareAgent :</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="190.75" x2="377.1899" y1="335.863" y2="335.863"/></g><g class="entity" data-qualified-name="GMN13" data-source-line="24" id="ent0014"><path d="M52.41,406.9314 L52.41,478.1736 A0,0 0 0 0 52.41,478.1736 L515.0863,478.1736 A0,0 0 0 0 515.0863,478.1736 L515.0863,416.9314 L505.0863,406.9314 L287.75,406.9314 L283.75,346.5714 L279.75,406.9314 L52.41,406.9314 A0,0 0 0 0 52.41,406.9314" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M505.0863,406.9314 L505.0863,416.9314 L515.0863,416.9314 L505.0863,406.9314" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.499" x="58.41" y="424.4998">Examples: an automated payment terminal or autonomous robot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.0205" x="58.41" y="439.8103">Software execution and physical actor have separate identities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.0474" x="58.41" y="455.1209">The software-agent link has no minimum or maximum count.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="441.6763" x="58.41" y="470.4314">Agent/Machine membership does not grant permission or a mandate.</text></g><!--reverse link Agent to Person--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="association" data-source-line="17" id="lnk7"><path codeLine="17" d="M375.75,209.6814 C375.75,209.6814 415.51,250.6114 443.32,279.2214" fill="none" id="Agent-backto-Person" style="stroke:#8B0000;stroke-width:1;"/></g><!--reverse link Agent to Organization--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="association" data-source-line="18" id="lnk8"><path codeLine="18" d="M375.75,209.6814 C375.75,209.6814 465.87,238.8714 535.75,267.9314 C544.17,271.4314 552.99,275.3214 561.59,279.2514" fill="none" id="Agent-backto-Organization" style="stroke:#8B0000;stroke-width:1;"/></g><!--reverse link Agent to SoftwareAgent--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="association" data-source-line="19" id="lnk9"><path codeLine="19" d="M375.75,209.6814 C375.75,209.6814 256.44,235.4014 164.75,267.9314 C155.16,271.3314 145.15,275.2914 135.45,279.3614" fill="none" id="Agent-backto-SoftwareAgent" style="stroke:#8B0000;stroke-width:1;"/></g><!--reverse link Agent to Machine--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="association" data-source-line="20" id="lnk10"><path codeLine="20" d="M375.75,209.6814 C375.75,209.6814 345.83,241.1514 320.11,268.1914" fill="none" id="Agent-backto-Machine" style="stroke:#8B0000;stroke-width:1;"/></g><!--reverse link SoftwareAgent to Machine--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="21" id="lnk12"><path codeLine="21" d="M152.7758,320.8087 C166.6158,322.4987 175.13,322.9314 188.75,322.9314" fill="none" id="SoftwareAgent-backto-Machine" style="stroke:#8B0000;stroke-width:1;"/><polygon fill="#8B0000" points="146.82,320.0814,155.2688,325.1428,151.7831,320.6875,156.2385,317.2018,146.82,320.0814" style="stroke:#8B0000;stroke-width:1;"/></g><?plantuml-src dLJRRjim37tNLn3TouOXxRf7BmZGjNqeqAv5kWi6x4Mn6PkDB1aItIJT1kmZzeNxab5ot2OhKcHzyeNauJc74fdO81oLQ3d0dr-_uOGyvWnNuylFWqiOOniGj2tWgbe6ohM12vrNP34e5MPa6-rr3QLtRNDcA_J4skO8RzU2Hzwx-R4ppiE9zhCn5cl1KEd2pScMCDKcu5eaDpg48sPFavRnB7VsckuGtgYA2eISV6vGgPG5UurtjrbIiGSwT7hWnJcL5Nz5OzpydH7EsQh_EyO5znyR45VeWxFVx318h-pmS3JC8_6iz7ev6jBe0cr0GpUpbMV30neD3rAEF6FHA17eS9x3uDANsjATPdgAHvSLKjOs3kj8ps5oxQOyrnwJqErKngsrSNvXbGuwP-UtaTe0_KzME9c7EbkTl-s4xazgpsWWPuUzCmQBfycje7Ua1TyLlFQj3PkQClLJgUvr-6Cmk3yAs-Mj9M_ERAUIVnpTgUPUwFRiLKgMFLOuC3ZbmMZtpiewHfWuPbU3c_Rj5S3fGjUDmP39ZW7TIbopEDlePHqn6NrDLaOfkoD6hQjT6y0xmTgNyfu1u0BpDfaMTrNJdu0qRQZqBKB0k5Q4XcmFoyI48I9yhF3XdEWaH7JCf2Q0TI3TgMxhsB_MY_IQkzQcvadsGMzbZVL49brH0uN3MCoo5hNWDL54295Sb250jX0Y-mg5QdH6AODb_63NGFHMmDCDx7QWW4LHN25v4Kg1utMh2BtsURKKGZN2r8kraW8DMIiEKjqudsZs12F6urb6yxwSllzqTduYs2phBVAClWTusLsuLn7bWtjmiC_l4BhB6PTxEn7huDZvrN84RQYqSP1fLXJ3vOCcIOic5IX_l50kADmuaZ8NPLQw5Q6tdKsTFty1?></g></svg>