<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="627px" preserveAspectRatio="none" style="width:901px;height:627px;background:#FFFFFF;" version="1.1" viewBox="0 0 901 627" width="901px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="355" x="266" y="23.5352">WEBUILD Agent and the PROV-O Agent hierarchy</text><rect fill="#DDDDDD" height="75.9531" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1.0;" width="507" x="12" y="49.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="490" x="17" y="68.0234">prov: classes and their existing hierarchy come from the pinned import.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="497" x="17" y="84.5117">Machine and runsSoftwareAgent are WEBUILD extension terms (ebwsm:).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="398" x="17" y="101">The FOAF module equates foaf:Agent with dcterms:Agent.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="371" x="17" y="117.4883">Sibling classes are not declared disjoint or exhaustive.</text><!--class FoafAgent--><g id="elem_FoafAgent"><rect codeLine="9" fill="#FFFFE0" height="42.4883" id="FoafAgent" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="78" x="319" y="145.4414"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72" x="322" y="163.9766">foaf:Agent</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="320" x2="396" y1="171.9297" y2="171.9297"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="320" x2="396" y1="179.9297" y2="179.9297"/></g><!--class WebuildAgent--><g id="elem_WebuildAgent"><rect codeLine="10" fill="#FFFFE0" height="42.4883" id="WebuildAgent" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="86" x="315" y="287.9314"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80" x="318" y="306.4666">ebwv:Agent</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="316" x2="400" y1="314.4197" y2="314.4197"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="316" x2="400" y1="322.4197" y2="322.4197"/></g><polygon fill="none" points="358,330.4197,365,350.4197,351,350.4197" style="stroke:#8B0000;stroke-width:1.0;"/><line style="stroke:#8B0000;stroke-width:1.0;" x1="358" x2="358" y1="350.4197" y2="352.1714"/><line style="stroke:#8B0000;stroke-width:1.0;" x1="358" x2="358" y1="287.9314" y2="267.5914"/><!--class WebuildSoftware--><g id="elem_WebuildSoftware"><rect codeLine="11" fill="#FFFFE0" height="42.4883" id="WebuildSoftware" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="118" x="7" y="428.6714"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112" x="10" y="447.2066">ebwsm:Software</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="8" x2="124" y1="455.1597" y2="455.1597"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="8" x2="124" y1="463.1597" y2="463.1597"/></g><!--class WebuildPerson--><g id="elem_WebuildPerson"><rect codeLine="12" fill="#FFFFE0" height="42.4883" id="WebuildPerson" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="105" x="400.5" y="428.6714"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99" x="403.5" y="447.2066">ebwsm:Person</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="401.5" x2="504.5" y1="455.1597" y2="455.1597"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="401.5" x2="504.5" y1="463.1597" y2="463.1597"/></g><!--class WebuildOrganization--><g id="elem_WebuildOrganization"><rect codeLine="13" fill="#FFFFE0" height="42.4883" id="WebuildOrganization" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="148" x="541" y="428.6714"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142" x="544" y="447.2066">ebwsm:Organization</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="542" x2="688" y1="455.1597" y2="455.1597"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="542" x2="688" y1="463.1597" y2="463.1597"/></g><!--class Agent--><g id="elem_Agent"><rect codeLine="14" fill="#FFFFE0" height="42.4883" id="Agent" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="82" x="611" y="145.4414"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76" x="614" y="163.9766">prov:Agent</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="612" x2="692" y1="171.9297" y2="171.9297"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="612" x2="692" y1="179.9297" y2="179.9297"/></g><polygon fill="none" points="652.494,187.9297,659.957,207.7616,645.9608,208.087" style="stroke:#8B0000;stroke-width:1.0;"/><line style="stroke:#8B0000;stroke-width:1.0;" x1="652.9589" x2="653" y1="207.9243" y2="209.6914"/><!--class Person--><g id="elem_Person"><rect codeLine="15" fill="#FFFFE0" height="55.4434" id="Person" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="96" x="456" y="281.4514"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82" x="463" y="299.9866">prov:Person</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="90" x="459" y="313.5745">Menselijke Agent</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="457" x2="551" y1="320.8948" y2="320.8948"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="457" x2="551" y1="328.8948" y2="328.8948"/></g><!--class Organization--><g id="elem_Organization"><rect codeLine="16" fill="#FFFFE0" height="55.4434" id="Organization" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="131" x="586.5" y="281.4514"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125" x="589.5" y="299.9866">prov:Organization</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="70" x="617" y="313.5745">Organisation</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="587.5" x2="716.5" y1="320.8948" y2="320.8948"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="587.5" x2="716.5" y1="328.8948" y2="328.8948"/></g><!--class SoftwareAgent--><g id="elem_SoftwareAgent"><rect codeLine="17" fill="#FFFFE0" height="55.4434" id="SoftwareAgent" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="142" x="752" y="281.4514"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136" x="755" y="299.9866">prov:SoftwareAgent</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="125" x="760.5" y="313.5745">Running software actor</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="753" x2="893" y1="320.8948" y2="320.8948"/><line style="stroke:#8B0000;stroke-width:0.5;" x1="753" x2="893" y1="328.8948" y2="328.8948"/></g><!--class Machine--><g id="elem_Machine"><rect codeLine="18" fill="#FFFFE0" height="71.9316" id="Machine" rx="2.5" ry="2.5" style="stroke:#8B0000;stroke-width:0.5;" width="190" x="168" y="414.4214"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109" x="208.5" y="432.9566">ebwsm:Machine</text><text fill="#808080" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="184" x="171" y="446.5445">Physical software-controlled actor</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="169" x2="357" y1="453.8648" y2="453.8648"/><text fill="#8B0000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="174" y="471.3999">+runsSoftwareAgent :</text><line style="stroke:#8B0000;stroke-width:0.5;" x1="169" x2="357" y1="478.353" y2="478.353"/></g><g id="elem_GMN22"><path d="M33.5,549.4214 L33.5,620.6636 A0,0 0 0 0 33.5,620.6636 L492.5,620.6636 A0,0 0 0 0 492.5,620.6636 L492.5,559.4214 L482.5,549.4214 L267,549.4214 L263,489.0614 L259,549.4214 L33.5,549.4214 A0,0 0 0 0 33.5,549.4214 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M482.5,549.4214 L482.5,559.4214 L492.5,559.4214 L482.5,549.4214 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="410" x="39.5" y="566.9898">Examples: an automated payment terminal or autonomous robot.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396" x="39.5" y="582.3003">Software execution and physical actor have separate identities.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390" x="39.5" y="597.6109">The software-agent link has no minimum or maximum count.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438" x="39.5" y="612.9214">Agent/Machine membership does not grant permission or a mandate.</text></g><!--reverse link FoafAgent to WebuildAgent--><g id="link_FoafAgent_WebuildAgent"><path codeLine="22" d="M358,206.4114 C358,227.1814 358,241.6814 358,267.5914 " fill="none" id="FoafAgent-backto-WebuildAgent" style="stroke:#8B0000;stroke-width:1.0;"/><polygon fill="none" points="358,188.4114,352,206.4114,364,206.4114,358,188.4114" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link WebuildAgent to WebuildPerson--><g id="link_WebuildAgent_WebuildPerson"><path codeLine="23" d="M358,352.1714 C358,352.1714 404.97,400.0014 432.85,428.4014 " fill="none" id="WebuildAgent-backto-WebuildPerson" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link WebuildAgent to WebuildOrganization--><g id="link_WebuildAgent_WebuildOrganization"><path codeLine="24" d="M358,352.1714 C358,352.1714 450.43,382.4514 523,410.4214 C537.38,415.9614 552.88,422.3014 566.98,428.2214 " fill="none" id="WebuildAgent-backto-WebuildOrganization" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link Agent to Person--><g id="link_Agent_Person"><path codeLine="25" d="M653,209.6914 C653,209.6914 589.21,251.8514 545.11,281.0014 " fill="none" id="Agent-backto-Person" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link Agent to Organization--><g id="link_Agent_Organization"><path codeLine="26" d="M653,209.6914 C653,209.6914 652.57,251.8514 652.28,281.0014 " fill="none" id="Agent-backto-Organization" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link Agent to SoftwareAgent--><g id="link_Agent_SoftwareAgent"><path codeLine="27" d="M653,209.6914 C653,209.6914 725.78,251.8514 776.1,281.0014 " fill="none" id="Agent-backto-SoftwareAgent" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link WebuildAgent to WebuildSoftware--><g id="link_WebuildAgent_WebuildSoftware"><path codeLine="28" d="M358,352.1714 C358,352.1714 234.84,374.8214 142,410.4214 C128.88,415.4514 115.03,422.0514 102.8,428.3614 " fill="none" id="WebuildAgent-backto-WebuildSoftware" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link WebuildAgent to Machine--><g id="link_WebuildAgent_Machine"><path codeLine="29" d="M358,352.1714 C358,352.1714 327.1,383.6414 300.55,410.6814 " fill="none" id="WebuildAgent-backto-Machine" style="stroke:#8B0000;stroke-width:1.0;"/></g><!--reverse link WebuildSoftware to Machine--><g id="link_WebuildSoftware_Machine"><path codeLine="30" d="M131.3978,462.9128 C144.9778,464.8828 153.47,465.4214 167,465.4214 " fill="none" id="WebuildSoftware-backto-Machine" style="stroke:#8B0000;stroke-width:1.0;"/><polygon fill